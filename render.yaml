databases:
  - name: fishercell-db
    databaseName: choice_circle
    user: choice_circle
    region: oregon
    plan: free

services:
  - type: web
    name: fishercell
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fishercell-db
          property: connectionString